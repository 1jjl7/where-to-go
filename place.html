<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>وين أروح</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=El+Messiri:wght@600;700&family=Reem+Kufi:wght@600;700&family=Rubik:wght@600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-city="riyadh">

  <header class="site-header">
    <div class="container header-row">
      <a class="logo" href="index.html" data-i18n="siteName">وين أروح</a>
      <div class="header-actions">
        <a class="back-link" id="back-link" href="index.html"></a>
        <button type="button" class="lang-btn" id="lang-btn" data-i18n="langButton">English</button>
      </div>
    </div>
  </header>

  <section class="place-hero">
    <img class="place-hero-img" id="hero-img" src="" alt="">
    <div class="hero-overlay"></div>
    <div class="container place-hero-content">
      <nav class="breadcrumb" aria-label="مسار الصفحة" data-i18n-aria="breadcrumb">
        <a id="crumb-city" href="index.html"></a>
        <span aria-hidden="true">/</span>
        <span id="crumb-cat"></span>
      </nav>
      <h1 id="place-name"></h1>
      <p class="place-name-alt" id="place-name-alt"></p>
    </div>
  </section>

  <main class="container place-main" id="place-main">
    <div class="place-grid">

      <div class="place-info">
        <div class="score-boxes">
          <div class="score-box google">
            <span class="label" data-i18n="googleLabel"></span>
            <strong class="big" id="google-rating"></strong>
            <span class="small" id="google-count"></span>
          </div>
          <div class="score-box visitors">
            <span class="label" data-i18n="visitorsLabel"></span>
            <strong class="big" id="visitor-rating"></strong>
            <span class="small" id="visitor-count"></span>
          </div>
        </div>

        <dl class="facts">
          <div><dt data-i18n="hood"></dt><dd id="fact-hood"></dd></div>
          <div><dt data-i18n="price"></dt><dd id="fact-price"></dd></div>
          <div><dt data-i18n="familyFriendly"></dt><dd id="fact-family"></dd></div>
          <div><dt data-i18n="hours"></dt><dd id="fact-hours"></dd></div>
        </dl>

        <ul class="tags big-tags" id="place-tags"></ul>

        <a class="btn" id="maps-link" target="_blank" rel="noopener" data-i18n="openInMaps"></a>
        <p class="source-note" id="source-note"></p>
      </div>

      <section class="review-form-wrap" aria-labelledby="form-title">
        <h2 id="form-title" data-i18n="formTitle"></h2>
        <form id="review-form" novalidate>
          <fieldset class="stars-input">
            <legend data-i18n="yourRating"></legend>
            <div class="stars-row" id="stars-row"></div>
            <p class="star-label" id="star-label" aria-live="polite"></p>
          </fieldset>
          <label for="review-name" data-i18n="nameLabel"></label>
          <input id="review-name" type="text" maxlength="40" data-i18n-ph="namePlaceholder">
          <label for="review-text" data-i18n="commentLabel"></label>
          <textarea id="review-text" rows="4" maxlength="500" data-i18n-ph="commentPlaceholder"></textarea>
          <p class="form-error" id="form-error" role="alert"></p>
          <button class="btn" type="submit" data-i18n="submit"></button>
          <p class="source-note" data-i18n="localNote"></p>
        </form>
      </section>
    </div>

    <section class="reviews-wrap" aria-labelledby="reviews-title">
      <h2 id="reviews-title" data-i18n="reviewsTitle"></h2>
      <ul class="reviews-list" id="reviews-list"></ul>
    </section>

    <section class="similar-wrap" aria-labelledby="similar-title">
      <h2 id="similar-title"></h2>
      <div class="similar" id="similar"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footerAuthor"></p>
    </div>
  </footer>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="place.js"></script>
</body>
</html>
